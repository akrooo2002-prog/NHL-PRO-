<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NHL Pronos">
<title>NHL Pronos — quel marché jouer, et pourquoi</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0a0c10; --card:#12161c; --card2:#171c24; --line:#222934;
  --txt:#e8edf4; --mut:#8896a8; --acc:#4da3ff; --gold:#f2c14e; --sil:#b9c3d0; --brz:#d09264;
  --ok:#3ecf8e; --warn:#ffb020; --bad:#ff5f6d;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--acc);text-decoration:none}
code{background:#0f1319;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- en-tête ---------- */
#hdr{position:sticky;top:0;z-index:20;background:rgba(10,12,16,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:10px 14px 9px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,#4da3ff,#1f5fd0);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
.brand .sp{flex:1}
#hdrSub{margin:7px 0 0;font-size:12px;color:var(--mut);line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mut);background:#0f1319}
.badge.w{color:#ffd479;border-color:#4a3a18;background:#1d1710}
.badge.f{color:#8fd7ff;border-color:#1e3550;background:#101a24}

/* ---------- boutons ---------- */
.btn{appearance:none;border:1px solid var(--line);background:#141922;color:var(--txt);
  border-radius:10px;padding:9px 13px;font:inherit;font-size:13.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;min-height:40px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:650}
.btn.pri:disabled{opacity:.45}
.btn.gh{background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.btn.on{border-color:var(--acc);color:var(--acc)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.ctl .sp{flex:1}
.ic{width:16px;height:16px;flex:0 0 auto}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- navigation basse ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(13,16,21,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;appearance:none;border:0;background:transparent;color:var(--mut);
  padding:9px 2px 8px;font:inherit;font-size:10.5px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;transition:.15s}
#nav button svg{width:20px;height:20px}
#nav button.on{color:var(--acc)}
#nav button.on svg{filter:drop-shadow(0 0 6px rgba(77,163,255,.45))}

/* ---------- contenu ---------- */
#main{padding:14px 14px 96px;max-width:1080px;margin:0 auto}
#foot{padding:0 14px 110px;max-width:1080px;margin:0 auto;font-size:11.5px;color:#5f6b7b;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card,.match{content-visibility:auto;contain-intrinsic-size:auto 240px}
.spin-note:before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin-right:8px;vertical-align:-2px;animation:sp .8s linear infinite}
.card h2{margin:0 0 9px;font-size:14.5px;letter-spacing:-.1px}
.card h3{margin:0 0 8px;font-size:13.5px}
.note{margin:0;color:var(--mut);font-size:13px;line-height:1.5}
.day{margin:20px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--mut);font-weight:650;display:flex;align-items:center;gap:10px}
.day:before,.day:after{content:"";height:1px;background:var(--line);flex:1}
.day:first-child{margin-top:4px}
.pill{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:999px;
  padding:2px 7px;color:var(--mut);background:#0f1319;vertical-align:1px}
.pill.pre{color:#c8a4ff;border-color:#3a2b52;background:#171226}
.pill.g{color:#7fe0b0;border-color:#1d4535;background:#0f1d18}
.pill.r{color:#ff9aa4;border-color:#4a2028;background:#1d1013}
.pill.n{color:#8fd7ff;border-color:#1e3550;background:#101a24}

/* ---------- podium ---------- */
.podium{display:flex;gap:8px;align-items:flex-end}
.pod{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:13px;
  padding:9px 7px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.pod:active{transform:scale(.98)}
.pod .rk{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#0f1319;border:1px solid var(--line)}
.pod.r1 .rk{background:#3a2f10;border-color:#6b5417;color:var(--gold)}
.pod.r2 .rk{background:#232a33;border-color:#3b4653;color:var(--sil)}
.pod.r3 .rk{background:#2e1f14;border-color:#5b3d24;color:var(--brz)}
.pod.r1{border-color:#4a3d16;background:linear-gradient(180deg,#1c1a12,#171c24)}
.pod img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#0f1319;
  border:2px solid var(--line);display:block;margin:6px auto 5px}
.pod.r1 img{width:60px;height:60px;border-color:#6b5417}
.pod .nm{font-size:12px;font-weight:650;line-height:1.25;min-height:30px;
  display:flex;align-items:center;justify-content:center}
.pod .tm{font-size:10px;color:var(--mut);letter-spacing:.04em}
.pod .pc{font-size:19px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
.pod .st{font-size:9.5px;color:var(--gold);letter-spacing:-1px}
.pod .mt{font-size:9.5px;color:var(--mut);margin-top:2px}
.mkt{margin:0 0 10px}
.mkt h3{display:flex;align-items:baseline;gap:8px}
.mkt h3 .sp{flex:1}
.mkt h3 .more{font-size:11.5px;color:var(--mut);font-weight:400}
.fallback{background:#171226;border:1px solid #3a2b52;color:#d8c6ff}

/* ---------- liste de choix ---------- */
.pick{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid #1a2029}
.pick:first-child{border-top:0}
.pick img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#0f1319;flex:0 0 auto}
.pick .b{flex:1;min-width:0}
.pick .t{display:flex;align-items:baseline;gap:7px}
.pick .n{font-weight:650;font-size:13.5px}
.pick .pr{margin-left:auto;font-weight:800;font-size:14px;letter-spacing:-.3px}
.pick .st{font-size:10px;color:var(--gold);letter-spacing:-1px}
.pick .why{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.45}
.pick .kv{font-size:11.5px;color:#7f8ca0;margin-top:3px}
.mk{font-size:10.5px;letter-spacing:.11em;color:var(--mut);font-weight:700;margin:0 0 6px}
.grid{display:grid;gap:10px}
@media(min-width:760px){.g3{grid-template-columns:repeat(3,1fr)}}

/* ---------- match ---------- */
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:0 0 11px}
.match.pre{border-color:#2c2340}
.mhead{display:flex;align-items:baseline;gap:8px;cursor:pointer}
.mtitle{font-weight:700;font-size:14.5px;letter-spacing:-.2px}
.mmeta{margin-left:auto;font-size:11.5px;color:var(--mut);white-space:nowrap}
.gk{font-size:12px;color:var(--mut);margin:7px 0 10px;line-height:1.45}
.gk b{color:var(--txt);font-weight:650}

/* ---------- contexte / gardiens ---------- */
.ctxgrid{display:grid;gap:10px}
@media(min-width:760px){.ctxgrid{grid-template-columns:1fr 1fr}}
.tside{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px}
.tside h4{margin:0 0 7px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.row span:last-child{font-weight:650}
select,input[type=text]{appearance:none;background:#0f1319;color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;width:100%;min-height:38px}
select:focus,input:focus{outline:2px solid #2b5f96;outline-offset:-1px}
label.lb{display:block;font-size:11px;color:var(--mut);margin:0 0 4px;letter-spacing:.04em}

/* ---------- tableau ---------- */
.tw{overflow-x:auto;border-top:1px solid #1a2029;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid #181e26}
th{color:var(--mut);font-weight:600;font-size:11px;cursor:pointer;position:sticky;top:0;background:var(--card)}
tr:hover td{background:#141a22}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.st{color:var(--gold);letter-spacing:-1px;font-size:11px}

/* ---------- live ---------- */
.lscore{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.lscore .t{flex:1;font-size:14px;font-weight:650}
.lscore .t.r{text-align:right}
.lscore .s{font-size:30px;font-weight:800;letter-spacing:-1px;min-width:34px;text-align:center}
.lstate{font-size:11px;color:var(--mut);text-align:center;margin-bottom:8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);
  margin-right:5px;vertical-align:1px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.hit{color:var(--ok);font-weight:700}

/* ---------- divers ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;
  background:#0f1319;cursor:pointer;min-height:30px}
.chip.on{border-color:var(--bad);color:#ff9aa4;background:#1d1013}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:40;
  background:#1b222c;border:1px solid var(--line);border-radius:11px;padding:11px 15px;
  font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.kv2{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:6px}
.bar{height:4px;border-radius:2px;background:#1c232c;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--acc)}
h2.sec{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
/* ===== vague 9 : contraste par équipe, indice, filtres ===== */
:root{--tmA:#3b82f6;--tmH:#ef4444;--tmAbg:rgba(59,130,246,.14);--tmHbg:rgba(239,68,68,.14)}
.pill.tA{background:var(--tmAbg);color:#8ab6ff;border:1px solid rgba(59,130,246,.45)}
.pill.tH{background:var(--tmHbg);color:#ff9d9d;border:1px solid rgba(239,68,68,.45)}
.pick.bA{border-left:3px solid var(--tmA)}
.pick.bH{border-left:3px solid var(--tmH)}
.conf{display:inline-block;min-width:42px;text-align:center;padding:1px 7px;border-radius:999px;
  font-weight:700;font-size:12px;margin-left:4px}
.conf.c5{background:rgba(62,207,142,.18);color:#3ecf8e}
.conf.c4{background:rgba(163,217,87,.16);color:#a3d957}
.conf.c3{background:rgba(242,193,78,.16);color:#f2c14e}
.conf.c2{background:rgba(255,176,32,.16);color:#ffb020}
.conf.c1{background:rgba(255,95,109,.16);color:#ff5f6d}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.filters label{display:inline-flex;align-items:center;gap:6px;background:var(--card2);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;
  cursor:pointer;user-select:none}
.filters input{accent-color:var(--acc);margin:0}
.filters label.off{opacity:.42}
.ev{font-size:12px;color:var(--gold);white-space:nowrap}
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.gteam{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
.gteam .dot{width:13px;height:13px;border-radius:50%;flex:none}
.mk-sec h3{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
</style>
</head>
<body>

<header id="hdr">
  <div class="brand">
    <div class="logo">N</div>
    <h1>NHL Pronos</h1>
    <div class="sp"></div>
    <button class="btn sm" id="bReload" title="Recharger la page (équivalent F5)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 3v6h6"/></svg>
    </button>
    <button class="btn sm" id="bRefresh" title="Relancer la collecte et le moteur">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span id="bRefreshTx">Rafraîchir</span>
    </button>
  </div>
  <div class="badges">
    <span class="badge" id="bSeason">—</span>
    <span class="badge" id="bMode">—</span>
    <span class="badge" id="bAge">—</span>
  </div>
  <p id="hdrSub">Chargement…</p>
</header>

<main id="main"></main>
<div class="foot" id="foot"></div>
<nav id="nav"></nav>

<script>
"use strict";
/* ============================ état ============================ */
let PROXY="";
const S={d:null,srv:null,statique:false,api:"",complets:{},tab:"podium",game:null,date:null,
  mk:"pointeur",sort:{},ov:{},hidePre:false,live:null,liveAt:null,liveErr:null,jours:{},complets2:null,
  expand:false,search:""};
const $=s=>document.querySelector(s);
/* La page doit être servie par server.py. Ouverte en file://, rien ne peut
   fonctionner : les appels réseau relatifs sont bloqués par le navigateur. */
const SUR_HTTP=(typeof location==="undefined")||/^https?:$/.test(location.protocol||"");
/* API = base du serveur Python quand la page n'est pas servie en http (file://).
   PROXY = base du Worker Cloudflare, en hébergement statique, pour les deux
   routes qui exigent un intermédiaire (/live et /refresh). Ce sont deux choses
   différentes : le proxy ne sert PAS les fichiers du site. */
let API=(typeof location!=="undefined"&&location.protocol==="file:")
  ?"http://localhost:8000/":"";
async function lireConfig(){
  try{
    const r=await fetch("config.json",{cache:"no-store"});
    if(!r||!r.ok) return;
    const c=await r.json();
    if(c&&c.api){
      PROXY=String(c.api).replace(/\/+$/,"")+"/";
      S.api=PROXY;
    }
  }catch(e){ /* pas de config.json : on reste en mode local */ }
}
async function apiFetch(url,opt,ms){
  const ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  const h=setTimeout(()=>{ if(ctl) ctl.abort(); },ms||20000);
  try{
    const r=await fetch(API+url,Object.assign({},opt,ctl?{signal:ctl.signal}:{}));
    if(!r) throw new Error("réponse vide");
    if(r.status<200||r.status>=300) throw new Error("réponse HTTP "+r.status);
    return r;
  }catch(e){
    const m=(e&&e.name==="AbortError")?"délai dépassé (20 s)":((e&&e.message)||String(e));
    throw new Error(url+" — "+m);
  }finally{ clearTimeout(h); }
}
async function serverAlive(){
  if(!SUR_HTTP) return {ok:false,pourquoi:"file"};
  try{ const j=await apiFetch("api/health",null,6000).then(r=>r.json());
       return {ok:!!(j&&j.ok),info:j}; }
  catch(e){ return {ok:false,pourquoi:"reseau",erreur:String((e&&e.message)||e)}; }
}
function serverDiag(s){
  if(s&&s.pourquoi==="file") return "Cette page est ouverte directement depuis le disque "
    +"(file://). Le navigateur bloque alors tous les appels réseau. Sers l'app avec "
    +"<code>python3 server.py 8000</code> puis ouvre <code>http://localhost:8000</code>.";
  if(s&&s.pourquoi==="reseau") return "Le serveur ne répond pas ("+esc(s.erreur)
    +"). Vérifie qu'il tourne : <code>cd nhl-pronos &amp;&amp; python3 server.py 8000</code>, "
    +"puis recharge la page. Si tu passes par un proxy ou un aperçu distant, "
    +"ouvre plutôt <code>http://localhost:8000</code> en direct.";
  return "Serveur injoignable : relance <code>python3 server.py 8000</code>.";
}
async function chargerDonnees(){
  // relit aussi config.json : un onglet ouvert avant la mise en place du proxy
  // bascule tout seul sur « Rafraîchir » au prochain Recharger.
  await lireConfig();
  // statique : index léger (calendrier+contexte) puis un fichier par jour ;
  // serveur local : analyse.json complet d'un coup.
  try{ S.d=await apiFetch("data/index.json",null,60000).then(r=>r.json()); }
  catch(e){ S.d=await apiFetch("data/analyse.json",null,60000).then(r=>r.json()); }
  S.jours={}; S.complets={};
  S.statique=!!S.d.statique;
  S.date=S.d?(dates()[0]||S.date):S.date;
  header(); render();
  return S.d;
}

/* Mode statique : les joueurs d'un jour arrivent avec leur fichier (~30 Ko),
   pas au démarrage. Sans effet en mode serveur (players déjà présents). */
async function jourDe(date){
  if(!S.d||!S.statique||S.jours[date]) return;
  const j=await apiFetch("data/jour-"+date+".json",null,30000).then(r=>r.json());
  const parId={};
  (j.games||[]).forEach(g=>{ parId[g.id]=g; });
  S.d.games.forEach(g=>{ const pj=parId[g.id];
    if(pj){ g.players=pj.players; g.effectif=pj.effectif; } });
  S.jours[date]=true;
}
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const SEUIL=[0,0,50,62,75,88];
const LABEL={1:"1 — très spéculatif",2:"2 — risqué",3:"3 — correct",4:"4 — solide",5:"5 — forte conviction"};
const MKS=["buteur","passeur","pointeur"];
const MKD={buteur:"marquer un but",passeur:"délivrer une passe",pointeur:"marquer ou passer"};
const FRL={absent:"absent du dernier match",hors_echantillon:"forme non mesurée",
  b2b:"back-to-back",tir_chaud:"% de tir intenable",tir_froid:"réussite froide",
  pp_gonfle:"points gonflés par l'AN",echantillon:"petit échantillon",
  manuel_absent:"absent (déclaré)",recrue:"recrue",en_hausse:"en hausse"};

/* ============================ formatage ============================ */
const lab=s=>s?String(s).slice(0,4)+"-"+String(s).slice(4):"—";
const nbf=()=>S.d.analyses!=null?S.d.analyses:S.d.games.reduce((a,g)=>a+(g.players||[]).length,0);
const pcx=(x,d=1)=>x==null?"—":(x*100).toFixed(d).replace(".",",")+" %";
const f1=x=>x==null?"—":Number(x).toFixed(1).replace(".",",");
const f2=x=>x==null?"—":Number(x).toFixed(2).replace(".",",");
const pcent=p=>Math.round(p*100)+" %";
const etoiles=n=>"★".repeat(n)+"☆".repeat(5-n);
const palier=c=>{for(let n=5;n>=1;n--) if(c>=SEUIL[n]) return n; return 1;};
function dateFr(d){const j=new Date(d+"T12:00:00Z");
  return j.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});}
function dateCourte(d){const j=new Date(d+"T12:00:00Z");
  return j.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});}
function heureFr(u){return u?new Date(u).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"—";}
function initiales(n){return String(n||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function age(txt){
  const t=Date.parse(txt); if(isNaN(t)) return "—";
  const m=Math.round((Date.now()-t)/60000);
  if(m<2) return "à l'instant";
  if(m<60) return "il y a "+m+" min";
  const h=Math.round(m/60);
  if(h<24) return "il y a "+h+" h";
  return "il y a "+Math.round(h/24)+" j";
}

/* ============ moteur client (recalcul si gardien corrigé / absent) ============ */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function effG(game){
  const g={...game};
  g.goalieOptions={away:goalieOptions(g,g.away),home:goalieOptions(g,g.home)};
  g.players=(game.players||[]).map(p=>({...p,buteur:{...p.buteur},passeur:{...p.passeur},pointeur:{...p.pointeur},
    ...(p.doubleButeur?{doubleButeur:{...p.doubleButeur},tripleButeur:{...p.tripleButeur},
      doublePointeur:{...p.doublePointeur},triplePointeur:{...p.triplePointeur}}:{}),
    flags:p.flags.slice(),raw:{...p.raw}}));
  for(const side of ["away","home"]){
    const me=g.ctx[side]={...g.ctx[side]}, opp=side==="away"?"home":"away";
    const pid=S.ov[g.id]?.goalies?.[opp];
    if(!pid) continue;
    const gk=(g.goalieOptions?.[opp]||[]).find(x=>x.playerId===pid);
    if(!gk||!gk.sv) continue;
    const nouveau=clamp((1-gk.sv)/(1-S.d.league.savePctAvg),0.5,1.8);
    me.goalieF=nouveau;
    me.goalie={...(me.goalie||{}),name:gk.name,sv:gk.sv,gaa:gk.gaa,confirmed:true};
    g.players.filter(p=>p.abbr===me.abbr).forEach(p=>{
      const ng=p.lambdaSansGardien.g*nouveau;
      const na=p.lambdaSansGardien.a*nouveau+2*0.30*ng;
      p.buteur.lam=ng; p.passeur.lam=na; p.pointeur.lam=ng+na;
      p.buteur.prob=1-Math.exp(-ng); p.passeur.prob=1-Math.exp(-na);
      p.pointeur.prob=1-Math.exp(-(ng+na));
      if(p.doubleButeur){
        const lp=ng+na;
        const pq=(lam,k)=>{let q=0,t=Math.exp(-lam);for(let i=0;i<k;i++){q+=t;t*=lam/(i+1);}return Math.max(0,1-q);};
        p.doubleButeur.lam=ng; p.tripleButeur.lam=ng;
        p.doublePointeur.lam=lp; p.triplePointeur.lam=lp;
        p.doubleButeur.prob=Math.round(pq(ng,2)*10000)/10000;
        p.tripleButeur.prob=Math.round(pq(ng,3)*10000)/10000;
        p.doublePointeur.prob=Math.round(pq(lp,2)*10000)/10000;
        p.triplePointeur.prob=Math.round(pq(lp,3)*10000)/10000;
      }
      p.goalieF=nouveau; p.oppGoalie=gk.name;
    });
  }
  g.players.forEach(p=>{
    if(!isAbsent(g.id,p.id)) return;
    if(!p.flags.includes("manuel_absent")) p.flags.push("manuel_absent");
    p.buteur.prob*=0.30; p.passeur.prob*=0.30; p.pointeur.prob*=0.30;
  });
  for(const mk of MKS){
    g.players.forEach(p=>{
      p[mk].score=Math.round(100*p[mk].prob*10)/10;
      if(p.recrue){
        let c=p.recrue.confidence;
        if(p.flags.includes("absent")||p.flags.includes("manuel_absent")) c=Math.round(c*0.40*10)/10;
        p[mk].confidence=c; p[mk].palier=palier(c);
      }else if(p[mk].score>0){
        p[mk].confidence=Math.round(confiance(p[mk].prob,p.gp,p.flags,g.preseason)*10)/10;
        p[mk].palier=palier(p[mk].confidence);
      }else{
        p[mk].confidence=0; p[mk].palier=1;
      }
      p[mk].etoiles=etoiles(p[mk].palier);
    });
    const r=g.players.filter(p=>p[mk].score>0)
      .sort((a,b)=>b[mk].confidence-a[mk].confidence||b[mk].score-a[mk].score||a.name.localeCompare(b.name,"fr"));
    r.forEach((p,i)=>p[mk].rank=i+1);
    g.players.forEach(p=>{ if(!p[mk].rank) p[mk].rank=null; });
  }
  const BM=(S.d&&S.d.baremes)||{doubleButeur:[[8,5],[5,4],[2.5,3],[1,2],[0,1]],
    tripleButeur:[[3,5],[2,4],[1,3],[0.5,2],[0,1]],doublePointeur:[[35,5],[25,4],[15,3],[8,2],[0,1]],
    triplePointeur:[[12,5],[8,4],[4,3],[2,2],[0,1]]};
  for(const mk of ["doubleButeur","tripleButeur","doublePointeur","triplePointeur"]){
    if(!g.players.length||!g.players[0][mk]) continue;
    g.players.forEach(p=>{
      p[mk].score=Math.round(100*p[mk].prob*10)/10;
      let pal=1;
      for(const [seuil,n] of BM[mk]){ if(p[mk].score>=seuil){pal=n;break;} }
      if(p.recrue) pal=Math.min(2,pal);
      p[mk].palier=pal; p[mk].etoiles=etoiles(pal);
      if(!p.recrue&&p[mk].score>0)
        p[mk].confidence=Math.round(confiance(p[mk].prob,p.gp,p.flags,g.preseason)*10)/10;
    });
    const rs=g.players.filter(p=>p[mk].score>0)
      .sort((a,b)=>b[mk].score-a[mk].score||a.name.localeCompare(b.name,"fr"));
    rs.forEach((p,i)=>p[mk].rank=i+1);
    g.players.forEach(p=>{ if(!p[mk].rank) p[mk].rank=null; });
  }
  return g;
}
function confiance(prob,gp,flags,pre){
  let c=100*Math.pow(Math.max(0,Math.min(1,prob)),0.55), d=100;
  if(gp<20) d=42+58*(gp/20); else if(gp<45) d=82+18*((gp-20)/25);
  if(flags.includes("absent")||flags.includes("manuel_absent")) d*=0.30;
  else if(flags.includes("hors_echantillon")) d*=0.90;
  if(flags.includes("echantillon")) d*=0.88;
  if(flags.includes("b2b")) d*=0.93;
  if(pre) d*=0.80;
  return 0.80*c+0.20*d;
}
function goalieOptions(game,abbr){
  const probable=(game.ctx.away.abbr===abbr?game.ctx.away.goalie:game.ctx.home.goalie)||{};
  const base=(S.d.goalieList&&S.d.goalieList[abbr])||[];
  const out=[], seen=new Set();
  const add=gk=>{ if(gk&&gk.playerId&&!seen.has(gk.playerId)){seen.add(gk.playerId);out.push(gk);} };
  add(probable.playerId?{...probable}:null);
  base.forEach(add);
  return out;
}

async function refresh(){
  // site déployé (Netlify…) : pas de serveur Python ici — on passe par la
  // régénération GitHub, comme le bouton du bandeau
  if(S.statique&&S.api) return refreshStatique();
  const st=await serverAlive();
  S.srv=st;
  if(!st.ok){
    const m=$("#main");
    if(m){ m.innerHTML=""; m.appendChild(el("div","card","<h2>Rafraîchissement impossible</h2>"
      +'<p class="note">'+serverDiag(st)+"</p>")); }
    toast("Serveur injoignable — voir le détail à l'écran",5000);
    return;
  }
  let j=null;
  try{
    // GET et non POST : certains proxys d'aperçu refusent POST
    j=await apiFetch("api/refresh?lancer=1",null,30000).then(x=>x.json());
  }catch(e){
    const m=$("#main");
    if(m){ m.innerHTML=""; m.appendChild(el("div","card","<h2>Le serveur a refusé</h2>"
      +'<p class="note">'+esc(String((e&&e.message)||e))
      +". Si tu passes par un aperçu distant, ouvre <code>http://localhost:8000</code> "
      +"en direct, ou relance la collecte toi-même : "
      +"<code>python3 fetch_pronos.py &amp;&amp; python3 engine.py</code>.</p>")); }
    return;
  }
  if(j&&j.etat==="deja_en_cours"){ toast("Un rafraîchissement est déjà en cours."); watchRefresh(); return; }
  if(j&&j.etat==="termine"){ toast("Rien à relancer : analyse de "+age(S.d.generatedUtc)); return; }
  toast("Collecte des stats en cours… (~80 s)");
  watchRefresh();
}
/* Statique + proxy : on demande à GitHub Actions de régénérer le dépôt, puis on
   recharge. La collecte prend 2 à 3 minutes : on prévient, on n'attend pas. */
async function refreshStatique(){
  const avant=S.d?S.d.generatedUtc:null;
  let j=null;
  try{
    j=await apiFetch(PROXY+"refresh",null,20000).then(r=>r.json());
  }catch(e){
    toast("Proxy injoignable : "+String((e&&e.message)||e),6000);
    return;
  }
  if(j&&j.error){ toast("Refusé : "+j.error,6000); return; }
  toast(j&&j.detail?j.detail:"Régénération lancée — compte 2 à 3 minutes.",7000);
  const b=$("#bRefresh"), tx=$("#bRefreshTx");
  const t0=Date.now();
  const tic=setInterval(()=>{ if(tx) tx.textContent="En cours… "+Math.round((Date.now()-t0)/1000)+" s"; },1000);
  if(tx) tx.textContent="En cours… 0 s";
  for(let i=0;i<40;i++){
    await new Promise(r=>setTimeout(r,15000));
    try{ await chargerDonnees(); }catch(e){ continue; }
    if(S.d&&S.d.generatedUtc!==avant){
      clearInterval(tic); if(tx) tx.textContent="Rafraîchir";
      toast("Données mises à jour : "+age(S.d.generatedUtc));
      return;
    }
  }
  clearInterval(tic); if(tx) tx.textContent="Rafraîchir";
  toast("Toujours pas de nouvelles données après 10 min — voir l'onglet Actions de ton dépôt.",9000);
}

async function watchRefresh(){
  const tx=$("#bRefreshTx");
  const fin=etat=>{ if(tx) tx.textContent=etat; };
  fin("En cours…");
  try{
  for(let i=0;i<120;i++){
    await new Promise(r=>setTimeout(r,3000));
    let j=null;
    try{ j=await apiFetch("api/refresh",null,8000).then(x=>x.json()); }catch(e){ break; }
    if(!j||!j.running){
      fin("Rafraîchir");
      if(j&&j.ok===false){ toast("Échec : "+((j.log||[]).slice(-1)[0]||"?"),6000); }
      else{
        try{ await chargerDonnees(); toast("Analyse mise à jour "+age(S.d.generatedUtc)+"."); }
        catch(e){ toast("Analyse terminée mais rechargement impossible : "+e.message,6000); render(); }
      }
      return;
    }
  }
  fin("Rafraîchir");
  }catch(e){ fin("Rafraîchir"); toast("Suivi du rafraîchissement interrompu : "+e.message,5000); }
}

      if(c&&c.publiee){

  },90000);

}

async function analyserInstant(g0,opts){
  if(S.analyseEnCours) return;
  S.analyseEnCours=true;
  const compo=!!(opts&&opts.compo);
  try{
    toast((compo?"📋 Analyse officielle — ":"⚡ Analyse instantanée — ")+"collecte NHL en direct pour "
      +(g0.awayNameFr||g0.away||"")+" @ "+(g0.homeNameFr||g0.home||"")+"…",12000);
    const raw=await apiFetch("collecter?game="+g0.id+"&date="+g0.date+(compo?"&compo=1":""),null,30000).then(r=>r.json());
    if(raw&&raw.erreur) throw new Error(raw.erreur);
    toast("⚙️ Démarrage du moteur d'analyse…",8000);
    const t0=Date.now();
    const py=await moteurPy();
    py.globals.set("_payload",JSON.stringify(raw));
    const out=py.runPython(
      "import json,engine\n"
      +"_g=[x for x in engine.run(json.loads(_payload))['games'] if x['id']=="+g0.id+"]\n"
      +"json.dumps(_g[0] if _g else None,ensure_ascii=False)");
    const fiche=JSON.parse(out);
    if(!fiche) throw new Error("aucune analyse produite");
    fiche.instant={generatedUtc:raw.generatedUtc,dureeS:Math.round((Date.now()-t0)/100)/10,compo:compo};
    S.complets[g0.id]=fiche;
    goDetail(g0.id);
    toast("⚡ Terminée — données en direct",5000);
  }catch(e){
    toast("Analyse instantanée échouée : "+String((e&&e.message)||e),7000);
  }
  S.analyseEnCours=false;
}

/* ============================ onglet 1 : podium ============================ */
function podiumJour(games){
  const all=[];
  games.forEach(g=>{const e=effG(g);all.push({g,e});});
  const out={};
  MKS.forEach(mk=>{
    const rows=[];
    all.forEach(({g,e})=>{
      e.players.forEach(p=>{ if(p[mk].score>0) rows.push({p,g,e,mk}); });
    });
    rows.sort((a,b)=>b.p[mk].confidence-a.p[mk].confidence||b.p[mk].score-a.p[mk].score
      ||a.p.name.localeCompare(b.p.name,"fr"));
    // un joueur qui joue 2 fois dans la journée n'apparaît qu'une fois sur le podium
    const vus=new Set(), top=[];
    rows.forEach(r=>{ if(vus.has(r.p.id)) return; vus.add(r.p.id); top.push(r); });
    out[mk]=top.slice(0,3);
  });
  return out;
}

function ligne(p,g,mk,detail){
  const away=p.abbr===g.away;
  const d=el("div","pick "+(away?"bA":"bH"));
  d.appendChild(photo(p.name,p.headshot,""));

  t.innerHTML='<span class="st">'+p[mk].etoiles+'</span> <span class="n">'+esc(p.name)+'</span> '
    +'<span class="pill '+(away?"tA":"tH")+'">'+esc(p.abbr)+'</span>'
    +(p.recrue?' <span class="pill n">recrue</span>':"")
    +confBadge(p[mk])+evTags(p)
    +'<span class="pr">'+pcent(p[mk].prob)+"</span>";
  b.appendChild(t);
  b.appendChild(el("div","kv",court(p,mk)));
  if(detail) b.appendChild(el("div","why",esc(p[mk].why)));
  d.appendChild(b);
  return d;
}
function court(p,mk){
  const r=p.raw, bits=[];
  if(p.recrue) bits.push("recrue "+p.recrue.ligue);
  else if(r.toiMin) bits.push("TGL "+f1(r.toiMin)+" min");
  bits.push(f1(p.perGame.sh)+" tir/match");
  const v=p.perGame[mk==="buteur"?"g":mk==="passeur"?"a":"pts"];
  bits.push(f2(v)+" "+(mk==="buteur"?"but":mk==="passeur"?"passe":"point")+"/match");
  if(p.form&&p.form.n) bits.push(f2(p.form.pts)+" pt sur "+p.form.n);
  if(p.h2h&&p.h2h.n>=2) bits.push(p.h2h.n+" duels vs "+p.opp+" : "+f2(p.h2h.pts)+" pt");
  const out=[];
  if(p.oppGoalie) out.push("vs "+p.oppGoalie);
  return bits.filter(x=>x&&x!=="—").slice(0,5).join(" · ")
    +(out.length?" · "+out.join(" · "):"")+(p.milestones&&p.milestones.pts&&p.milestones.pts.gap
      &&p.milestones.pts.gap>0&&p.milestones.pts.gap<=6
      ?" · objectif "+p.milestones.pts.next+" pts":"");
}

function exportCsv(g){
  const head=["joueur","equipe","pos","marche","rang","probabilite","indice","palier","lambda","justification"];
  const rows=[];
  g.players.forEach(p=>MKS.forEach(mk=>{
    if(!p[mk].rank) return;
    rows.push([p.name,p.abbr,p.pos,mk,p[mk].rank,p[mk].prob,p[mk].confidence,p[mk].palier,
      p[mk].lam,String(p[mk].why).replace(/[\n;]/g," ")]);
  }));
  const csv=[head].concat(rows).map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(";")).join("\n");
  try{
    const url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    const a=el("a"); a.href=url; a.download="nhl-pronos-"+g.id+".csv";
    document.body.appendChild(a); if(a.click) a.click();
  }catch(e){ toast("Export impossible dans ce navigateur"); }
}

function liveDate(){
  const ds=dates();
  const auj=new Date().toISOString().slice(0,10);
  if(ds.includes(auj)) return auj;
  let best=null;
  ds.forEach(d=>{ if(d<=auj) best=d; });
  return best||ds[0];
}

async function loadLive(date,force,box){
  const b=box||($("#liveBox")||null);
  if(!force&&S.live&&Date.now()-S.liveAt<15000){ if(b) paintLive(b); return; }
  try{
    const chemin=S.api?(PROXY+"live?date="+date):("api/live?date="+date);
    const r=await apiFetch(chemin,null,15000);
    S.live=await r.json(); S.liveErr=null; S.liveAt=Date.now();
  }catch(e){ S.liveErr=(e&&e.message)||"erreur"; }
  if(b) paintLive(b);
  if(S.tab==="live"&&!S.liveErr) setTimeout(()=>{ if(S.tab==="live") loadLive(date,true); },20000);
}
function scorersOf(t){
  /* l'API range les buteurs sous plusieurs clés selon la version : on les ramasse toutes */
  const out=[];
  Object.keys(t||{}).forEach(k=>{
    const v=t[k];
    if(Array.isArray(v)) v.forEach(x=>{ if(x&&x.playerId) out.push(x); });
  });
  if(t&&t.scorers&&Array.isArray(t.scorers)) t.scorers.forEach(x=>out.push(x));
  return out;
}
function paintLive(b){
  b.innerHTML="";
  const st=$("#liveStamp"); if(st) st.textContent=S.liveAt?"relevé "+age(new Date(S.liveAt).toISOString()):"";

      +"Worker Cloudflare de <code>FREE.md</code> (l'API NHL bloque les appels directs "
      +"depuis un navigateur).</p>"));

  }

  const games=(S.live.games||[]);
  if(!games.length){ b.appendChild(el("div","card",'<p class="note">Aucun match ce jour-là.</p>')); return; }
  const ls=S.live.lastScorer;

      +" ("+esc((ls.team&&ls.team.abbrev)||"")+") — "+esc(ls.timeInPeriod||"")+" P"+esc(ls.period||"")+"</p>"));
  }
  games.forEach(lg=>{
    const mine=S.d.games.find(x=>String(x.id)===String(lg.id));

      +esc(lg.period||"")+" "+esc(lg.clock||"")+(lg.inIntermission?" · pause":"")

    sc.appendChild(mid);
    sc.innerHTML=sc.innerHTML+'<div class="s num">'+String(ht.score??"—")+'</div><div class="t">'+esc(ht.abbrev||"")+"</div>";
    c.appendChild(sc);
    if(!mine){
      c.appendChild(el("p","note","Ce match n'est pas dans la période analysée."));
      b.appendChild(c); return;
    }
    const g=effG(mine);
    const ids={};
    [at,ht].forEach(t=>scorersOf(t).forEach(s=>{ids[String(s.playerId)]=(ids[String(s.playerId)]||0)+1;}));
    MKS.forEach(mk=>{

          +'<div class="kv">'+(n?'<span class="hit">'+n+" but(s) déjà</span> · ":"")

    [3,"62 à 75","correct","à combiner avec prudence"],
    [2,"50 à 62","risqué","petite mise seulement"],
    [1,"moins de 50","très spéculatif","à éviter"]];
  pal.appendChild(el("div","tw",'<table><thead><tr><th>Palier</th><th>Indice</th><th>Lecture</th>'
    +'<th>Usage</th></tr></thead><tbody>'
    +rows.map(r=>'<tr><td class="st">'+etoiles(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])
      +'</td><td>'+esc(r[3])+'</td></tr>').join("")+'</tbody></table>'));
  m.appendChild(pal);

  const lg=el("div","card");
  lg.appendChild(el("h2",null,"Références ligue"));
  [["ARR % moyen",pcx(L.savePctAvg)],["Buts concédés par match",f2(L.gaPerGame)],
   ["Tirs concédés par match",f1(L.shotsAgainst)],["Efficacité de tir",pcx(L.shootingPctAvg)],
   ["Désavantage numérique moyen",pcx(L.pkPctAvg)],["Matchs analysés",String(S.d.games.length)],
   ["Analyses joueur",nbf().toLocaleString("fr-FR")],["Saison de référence",lab(S.d.refSeason)]]
   .forEach(([k,v])=>{const r=el("div","row");
     r.innerHTML="<span>"+esc(k)+"</span><span>"+esc(v)+"</span>";lg.appendChild(r);});
  m.appendChild(lg);
}
